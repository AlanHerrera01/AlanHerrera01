<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Terminal: whoami, stack y estado de Alan Herrera">
  <defs>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <!-- comando 1 -->
    <clipPath id="c1"><rect x="88" y="52" height="26" width="0"><animate attributeName="width" from="0" to="70" dur="0.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="o1"><rect x="88" y="78" height="26" width="0"><animate attributeName="width" from="0" to="420" dur="1.1s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <!-- comando 2 -->
    <clipPath id="c2"><rect x="88" y="108" height="26" width="0"><animate attributeName="width" from="0" to="130" dur="0.7s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="o2"><rect x="88" y="134" height="26" width="0"><animate attributeName="width" from="0" to="600" dur="1.6s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <!-- comando 3 -->
    <clipPath id="c3"><rect x="88" y="164" height="26" width="0"><animate attributeName="width" from="0" to="140" dur="0.7s" begin="5.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="o3"><rect x="110" y="190" height="26" width="0"><animate attributeName="width" from="0" to="560" dur="1.6s" begin="5.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace; }
    @keyframes ping { 0% { r: 4; opacity: .9; } 100% { r: 11; opacity: 0; } }
    .ping { animation: ping 1.8s ease-out infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="249" rx="14" fill="#0a0e17" stroke="#3c4a42" stroke-opacity="0.8"/>
  <rect x="0.5" y="0.5" width="899" height="249" rx="14" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle cx="820" cy="40" r="80" fill="#4cd7f6" fill-opacity="0.10"/>
    <circle cx="80" cy="220" r="70" fill="#4edea3" fill-opacity="0.10"/>
  </g>

  <!-- barra de la ventana -->
  <path d="M0.5 36 V14.5 a14 14 0 0 1 14 -14 H885.5 a14 14 0 0 1 14 14 V36 Z" fill="#181b25" fill-opacity="0.9"/>
  <line x1="0.5" y1="36" x2="899.5" y2="36" stroke="#3c4a42" stroke-opacity="0.6"/>
  <circle cx="26" cy="18" r="5" fill="#ffb4ab" fill-opacity="0.85"/>
  <circle cx="46" cy="18" r="5" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="66" cy="18" r="5" fill="#4edea3" fill-opacity="0.85"/>
  <text class="mono" x="450" y="22" font-size="12" text-anchor="middle" fill="#bbcabf" fill-opacity="0.7">~/alan-herrera — zsh</text>

  <!-- 1: whoami -->
  <text class="mono" x="48" y="70" font-size="14" font-weight="700" fill="#4cd7f6">❯</text>
  <g clip-path="url(#c1)"><text class="mono" x="68" y="70" font-size="14" fill="#6ffbbe">whoami</text></g>
  <g clip-path="url(#o1)"><text class="mono" x="88" y="96" font-size="14" fill="#dfe2ef">Alan Herrera — full stack developer · applied AI</text></g>

  <!-- 2: stack -->
  <text class="mono" x="48" y="126" font-size="14" font-weight="700" fill="#4cd7f6">❯</text>
  <g clip-path="url(#c2)"><text class="mono" x="88" y="126" font-size="14" fill="#6ffbbe">cat stack.txt</text></g>
  <g clip-path="url(#o2)"><text class="mono" x="88" y="152" font-size="14" fill="#dfe2ef">Java · Spring Boot · TypeScript · JavaScript · Python · PHP · C++</text></g>

  <!-- 3: estado -->
  <text class="mono" x="48" y="182" font-size="14" font-weight="700" fill="#4cd7f6">❯</text>
  <g clip-path="url(#c3)"><text class="mono" x="88" y="182" font-size="14" fill="#6ffbbe">cat status.txt</text></g>
  <circle class="ping" cx="94" cy="207" r="4" fill="#4edea3"/>
  <circle cx="94" cy="207" r="4" fill="#4edea3"/>
  <g clip-path="url(#o3)"><text class="mono" x="110" y="212" font-size="14" fill="#dfe2ef">en línea — abierto a colaboraciones y oportunidades laborales</text></g>

  <rect class="cursor" x="634" y="198" width="8" height="16" fill="#4cd7f6" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="7.6s"/>
  </rect>
</svg>
