<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Alan Herrera - Full Stack Developer y Applied AI">
  <defs>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe2ef"/>
      <stop offset="1" stop-color="#6ffbbe"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="type1">
      <rect x="88" y="254" height="26" width="0">
        <animate attributeName="width" from="0" to="480" dur="2.4s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="88" y="284" height="26" width="0">
        <animate attributeName="width" from="0" to="560" dur="2.8s" begin="2.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace; }
    .sans { font-family: Geist,Inter,'Segoe UI',system-ui,-apple-system,sans-serif; }
    @keyframes ping { 0% { r: 4; opacity: .9; } 100% { r: 12; opacity: 0; } }
    .ping { animation: ping 1.8s ease-out infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,10px); } }
    .glow-a { animation: drift 9s ease-in-out infinite; }
  </style>

  <!-- fondo -->
  <rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="#0f131c" stroke="#3c4a42" stroke-opacity="0.8"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle class="glow-a" cx="430" cy="30" r="130" fill="#4edea3" fill-opacity="0.13"/>
    <circle cx="830" cy="310" r="110" fill="#4cd7f6" fill-opacity="0.12"/>
    <circle cx="70" cy="340" r="80" fill="#d0bcff" fill-opacity="0.08"/>
  </g>

  <!-- pastilla de estado -->
  <rect x="48" y="34" width="330" height="28" rx="14" fill="#262a34" fill-opacity="0.7" stroke="#4edea3" stroke-opacity="0.35"/>
  <circle class="ping" cx="68" cy="48" r="4" fill="#4edea3"/>
  <circle cx="68" cy="48" r="4" fill="#4edea3"/>
  <text class="mono" x="84" y="52" font-size="11" font-weight="500" letter-spacing="1.2" fill="#4edea3">SISTEMA EN LÍNEA // ABIERTO A OFERTAS</text>

  <!-- identidad -->
  <text class="sans" x="46" y="124" font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Alan Herrera</text>
  <text class="mono" x="48" y="154" font-size="16" fill="#4cd7f6" fill-opacity="0.9">@AlanHerrera01</text>
  <text class="sans" x="48" y="192" font-size="22" font-weight="600" fill="#6ffbbe">Full Stack Developer · Applied AI</text>

  <!-- terminal -->
  <rect x="48" y="212" width="804" height="124" rx="12" fill="#0a0e17" stroke="#3c4a42" stroke-opacity="0.6"/>
  <circle cx="70" cy="233" r="4" fill="#ffb4ab" fill-opacity="0.75"/>
  <circle cx="86" cy="233" r="4" fill="#fbbf24" fill-opacity="0.75"/>
  <circle cx="102" cy="233" r="4" fill="#4edea3" fill-opacity="0.75"/>
  <text class="mono" x="120" y="237" font-size="11" fill="#bbcabf" fill-opacity="0.6">zsh — bio.config</text>

  <text class="mono" x="68" y="272" font-size="14" font-weight="700" fill="#4cd7f6">❯</text>
  <g clip-path="url(#type1)">
    <text class="mono" x="88" y="272" font-size="14" fill="#dfe2ef">Full stack: del backend a la interfaz, con IA aplicada.</text>
  </g>
  <text class="mono" x="68" y="302" font-size="14" font-weight="700" fill="#4cd7f6">❯</text>
  <g clip-path="url(#type2)">
    <text class="mono" x="88" y="302" font-size="14" fill="#dfe2ef">Hackathons, trabajo en equipo y código que se despliega.</text>
  </g>
  <rect class="cursor" x="580" y="289" width="8" height="16" fill="#4cd7f6" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="5.6s"/>
  </rect>

  <!-- pie del banner -->
  <text class="mono" x="48" y="362" font-size="11" letter-spacing="1.5" fill="#86948a">JAVA · SPRING BOOT · TYPESCRIPT · JAVASCRIPT · PYTHON · CI/CD</text>
</svg>
